<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="./boxes.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="m-auto px-[50px]">
    <!-- <div class="object-contain">

      <img class="thaw" src="./Screenshot 2026-09-27 002451.png" alt="" />
    </div> -->
    <div>
      <input
        type="date"
        class="border ml-[70px] mt-[30px] w-[150px] bg-slate-400"
      />
    </div>
    <div
      class="lg:flex-row md:flex md:flex-col md:justify-center md:ml-[70px] lg:justify-center lg:pl-[80px] w-[250px ] mr-[20px]"
    >
      <div
        class="boxcontainer w-[500px] md:mt-[40px] mt-[20px] lg:mt-[70px] md:mb-[40px] sm:mb-10 md:gap-2 gap-2 mb-3 lg:gap-[30px]"
      >
        <div class="flex">
          <button class="box One">Box.1</button>
          <div class="trash">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="42"
              height="42"
              viewBox="0 0 24 24"
            >
              <!-- Icon from Material Symbols by Google - https://github.com/google/material-design-icons/blob/master/LICENSE -->
              <path
                fill="red
              "
                d="m9.4 16.5l2.6-2.6l2.6 2.6l1.4-1.4l-2.6-2.6L16 9.9l-1.4-1.4l-2.6 2.6l-2.6-2.6L8 9.9l2.6 2.6L8 15.1zM7 21q-.825 0-1.412-.587T5 19V6H4V4h5V3h6v1h5v2h-1v13q0 .825-.587 1.413T17 21zM17 6H7v13h10zM7 6v13z"
              />
            </svg>
          </div>
        </div>
        <div class="flex">
          <button class="box Two">Box.2</button>
          <div class="trash Two">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="42"
              height="42"
              viewBox="0 0 24 24"
            >
              <!-- Icon from Material Symbols by Google - https://github.com/google/material-design-icons/blob/master/LICENSE -->
              <path
                fill="red
              "
                d="m9.4 16.5l2.6-2.6l2.6 2.6l1.4-1.4l-2.6-2.6L16 9.9l-1.4-1.4l-2.6 2.6l-2.6-2.6L8 9.9l2.6 2.6L8 15.1zM7 21q-.825 0-1.412-.587T5 19V6H4V4h5V3h6v1h5v2h-1v13q0 .825-.587 1.413T17 21zM17 6H7v13h10zM7 6v13z"
              />
            </svg>
          </div>
        </div>
        <div class="flex">
          <button class="box Three">Box.3</button>
          <div class="trash Three">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="42"
              height="42"
              viewBox="0 0 24 24"
            >
              <!-- Icon from Material Symbols by Google - https://github.com/google/material-design-icons/blob/master/LICENSE -->
              <path
                fill="red
              "
                d="m9.4 16.5l2.6-2.6l2.6 2.6l1.4-1.4l-2.6-2.6L16 9.9l-1.4-1.4l-2.6 2.6l-2.6-2.6L8 9.9l2.6 2.6L8 15.1zM7 21q-.825 0-1.412-.587T5 19V6H4V4h5V3h6v1h5v2h-1v13q0 .825-.587 1.413T17 21zM17 6H7v13h10zM7 6v13z"
              />
            </svg>
          </div>
        </div>
        <div class="flex">
          <button class="box Four">Box.4</button>
          <div class="trash Four">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="42"
              height="42"
              viewBox="0 0 24 24"
            >
              <!-- Icon from Material Symbols by Google - https://github.com/google/material-design-icons/blob/master/LICENSE -->
              <path
                fill="red
              "
                d="m9.4 16.5l2.6-2.6l2.6 2.6l1.4-1.4l-2.6-2.6L16 9.9l-1.4-1.4l-2.6 2.6l-2.6-2.6L8 9.9l2.6 2.6L8 15.1zM7 21q-.825 0-1.412-.587T5 19V6H4V4h5V3h6v1h5v2h-1v13q0 .825-.587 1.413T17 21zM17 6H7v13h10zM7 6v13z"
              />
            </svg>
          </div>
        </div>
        <div class="flex">
          <button class="box Five">Box.5</button>
          <div class="trash Five">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="42"
              height="42"
              viewBox="0 0 24 24"
            >
              <!-- Icon from Material Symbols by Google - https://github.com/google/material-design-icons/blob/master/LICENSE -->
              <path
                fill="red
              "
                d="m9.4 16.5l2.6-2.6l2.6 2.6l1.4-1.4l-2.6-2.6L16 9.9l-1.4-1.4l-2.6 2.6l-2.6-2.6L8 9.9l2.6 2.6L8 15.1zM7 21q-.825 0-1.412-.587T5 19V6H4V4h5V3h6v1h5v2h-1v13q0 .825-.587 1.413T17 21zM17 6H7v13h10zM7 6v13z"
              />
            </svg>
          </div>
        </div>
      </div>
      <table
        class="h-[50px] w-[380px] md:mt-[0px] lg:mt-[90px] mb-3 mt-0 tableContainer border"
      >
        <tr class="border">
          <th class="p-4 text-center border tablechildNo">No.</th>

          <th class="p-4 text-center">Box</th>

          <th class="p-3 w-[100px] text-center">Quantity</th>

          <th class="w-[180px] px-6 text-center">Total</th>
        </tr>
      </table>

      <div class="lg:mt-[97px] md:mt-10 lg:ml-[50px] md:ml-0 md:mr-6">
        <table class="lg:mb-[60px] md:mb-10 mb-3 p-[10px]">
          <tr>
            <th class="p-[8px] text-center">Boxes</th>
            <th class="p-[8px] text-center">Income</th>
            <th class="p-[8px] text-center">Pending</th>
            <th class="p-[8px] text-center">Total</th>
          </tr>
          <tr>
            <td class="p-[8px] text-center">box1</td>

            <td class="p-[8px] w-[60px] text-center">
              <input
                type="number"
                class="p-[px] w-[60px] text-center incomeOne focus:outline-none"
              />
            </td>
            <td class="p-[8px] text-center">
              <input
                type="number"
                class="p-[px] w-[60px] text-center pendingOne focus:outline-none"
              />
            </td>
            <td class="totalOne p-[8px] text-center"></td>
          </tr>
          <tr>
            <td class="p-[8px] text-center">box2</td>

            <td class="p-[8px] text-center">
              <input
                type="number"
                class="incomeTwo p-[px] w-[60px] text-center focus:outline-none"
              />
            </td>
            <td class="p-[8px] text-center">
              <input
                type="number"
                class="p-[px] w-[60px] text-center pendingTwo focus:outline-none"
              />
            </td>
            <td class="totalTwo p-[8px] text-center"></td>
          </tr>
          <tr>
            <td class="p-[8px] text-center">box3</td>

            <td class="p-[8px] text-center">
              <input
                type="number"
                class="incomeThree p-[px] w-[60px] text-center focus:outline-none"
              />
            </td>
            <td class="p-[8px] text-center">
              <input
                type="number"
                class="p-[px] w-[60px] text-center pendingThree focus:outline-none"
              />
            </td>
            <td class="totalThree p-[8px] text-center"></td>
          </tr>
          <tr>
            <td class="p-[8px] text-center">box4</td>

            <td class="p-[8px] text-center">
              <input
                type="number"
                class="incomeFour p-[px] w-[60px] text-center focus:outline-none"
              />
            </td>
            <td class="p-[8px] text-center">
              <input
                type="number"
                class="p-[px] w-[60px] text-center pendingFour focus:outline-none"
              />
            </td>
            <td class="totalFour p-[8px] text-center"></td>
          </tr>
          <tr>
            <td class="p-[8px] text-center">box5</td>

            <td class="p-[8px] text-center">
              <input
                type="number"
                class="incomeFive p-[px] w-[60px] text-center focus:outline-none"
              />
            </td>
            <td class="p-[8px] text-center">
              <input
                type="number"
                class="p-[px] w-[60px] text-center pendingFive focus:outline-none"
              />
            </td>
            <td class="totalFive p-[8px] text-center"></td>
          </tr>
        </table>
        <table class="border w-[190px]">
          <tr class="border">
            <th class="grand bg-black mt-[400px] border">
              <span>Cash Total</span>
            </th>
          </tr>
        </table>
      </div>
    </div>
    <script src="./boxes.js"></script>
  </body>
</html>
